<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="GENESIS PICKING — Assistant de préparation de commandes, Univers Parapharmacie.">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Genesis Picking">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>GENESIS PICKING</title>
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#0B3D91">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #F8F9FA;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0B3D91;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }

        #loading-screen .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div>GENESIS PICKING</div>
    </div>

    <script src="flutter_bootstrap.js" async></script>
    <script>
        window.addEventListener('flutter-first-frame', function () {
            var loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                loadingScreen.remove();
            }
        });
    </script>
</body>
</html>
