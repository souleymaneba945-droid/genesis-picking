org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

# Force Gradle à utiliser le JDK embarqué d'Android Studio (stable, JBR)
# plutôt que le JDK système installé sur la machine, qui peut être trop
# récent pour la version de Gradle/AGP utilisée par ce projet. À adapter
# au chemin réel du JBR d'Android Studio sur la machine (voir Android
# Studio > File > Settings > Build, Execution, Deployment > Build Tools
# > Gradle > "Gradle JDK", champ "JDK location").
# org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
